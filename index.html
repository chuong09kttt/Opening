<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>AVEVA Equipment Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
    <header>
        <div class="logo">
            <i class="fa-solid fa-cube"></i>
            AVEVA Equipment Studio
        </div>
        <div class="status">
            <span class="green-dot"></span>
            Ready
        </div>
    </header>

    <div class="main">
        <div class="leftPanel">
            <!-- Dimensions - 1 hàng 4 cột -->
            <div class="group dimensions-group">
                <h2><i class="fa-solid fa-ruler-combined"></i> Dimensions</h2>
                <div class="dimensions-row">
                    <div class="dimension-item">
                        <label>Length</label>
                        <input id="length" type="number" value="5000">
                    </div>
                    <div class="dimension-item">
                        <label>Width</label>
                        <input id="width" type="number" value="5000">
                    </div>
                    <div class="dimension-item">
                        <label>Height</label>
                        <input id="height" type="number" value="1500">
                    </div>
                    <div class="dimension-item">
                        <label>Radius</label>
                        <input id="radius" type="number" value="100">
                    </div>
                </div>
            </div>

            <!-- Position -->
            <div class="group">
                <h2><i class="fa-solid fa-location-dot"></i> Position</h2>
                <div class="row">
                    <div><label>E</label><input id="posE" type="number" value="1000"></div>
                    <div><label>N</label><input id="posN" type="number" value="2000"></div>
                    <div><label>U</label><input id="posU" type="number" value="500"></div>
                </div>
            </div>

            <!-- Orientation -->
            <div class="group">
                <h2><i class="fa-solid fa-compass"></i> Orientation</h2>
                <select id="orientation">
                    <option value="Y IS N AND Z IS U">+Y</option>
                    <option value="Y IS S AND Z IS U">-Y</option>
                    <option value="X IS E AND Z IS U">+X</option>
                    <option value="X IS W AND Z IS U">-X</option>
                    <option value="Z IS U AND Y IS N">+Z</option>
                    <option value="Z IS D AND Y IS N">-Z</option>
                </select>
            </div>

            <!-- Voice Chat -->
            <div class="group voice-chat-group">
                <h2><i class="fa-solid fa-microphone"></i> Voice Chat</h2>
                <div id="chatContainer" class="chat-container">
                    <div class="chat-message bot"><i class="fa-solid fa-robot"></i><span>👋 Hello! I'm your voice assistant.</span></div>
                    <div class="chat-message bot"><i class="fa-solid fa-robot"></i><span>💡 Say: "Length 2000, Width 1000, Height 1500, Radius 100"</span></div>
                    <div class="chat-message bot"><i class="fa-solid fa-robot"></i><span>📝 I'll update the fields automatically.</span></div>
                </div>
                <div class="voice-controls">
                    <button id="voiceBtn" class="voice-btn"><i class="fa-solid fa-microphone"></i> Start Listening</button>
                    <button id="clearChatBtn" class="clear-btn" title="Clear chat"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div id="voiceStatus" class="voice-status">🔴 Ready</div>
            </div>

            <!-- Export Button -->
            <div class="group export-group">
                <button id="exportBtn" class="export-btn">
                    <i class="fa-solid fa-download"></i> Export TXT
                </button>
            </div>
        </div>
    </div>

    <footer>Ready · AVEVA Equipment Studio · v1.0</footer>
</div>

<script src="config.js"></script>
<script src="speech.js"></script>
<script src="script.js"></script>
</body>
</html>
